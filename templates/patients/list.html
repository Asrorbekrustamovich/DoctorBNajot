{% extends "base.html" %}

{% block title %}Bemorlar — Doctor B Najot{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3"><i class="bi bi-people"></i> Bemorlar kartotekasi</h1>
    <div>
        <a href="?format=excel" class="btn btn-outline-success me-2">
            <i class="bi bi-file-earmark-excel"></i> Excelga yuklash
        </a>
        {% if user.can_write_patients %}
        <a href="{% url 'patients:create' %}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Yangi bemor
        </a>
        {% endif %}
    </div>
</div>
<div class="card shadow-sm">
    <div class="card-body">
        <input type="search" name="q" value="{{ request.GET.q }}"
               class="form-control mb-3"
               placeholder="FIO, karta, telefon, JSHSHIR yoki pasport bo'yicha qidiring..."
               hx-get="{% url 'patients:list' %}"
               hx-trigger="input changed delay:400ms, search"
               hx-target="#patient-table"
               hx-push-url="true">
        <div id="patient-table">
            {% include "patients/_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
