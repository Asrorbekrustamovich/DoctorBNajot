# ============================================================
#  Doctor B Najot — HIS. Nginx sozlamasi.
#
#  O'rnatish:
#    sudo cp server/nginx-edumed.conf /etc/nginx/sites-available/edumed
#    sudo ln -sf /etc/nginx/sites-available/edumed /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS sertifikat (bepul, avtomatik yangilanadi):
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d doctorbnajot.uz -d www.doctorbnajot.uz
#  certbot quyidagi 443-blokni o'zi qo'shadi.
# ============================================================

upstream edumed_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# HTTP -> HTTPS yo'naltirish (sertifikat o'rnatilgach)
server {
    listen 80;
    listen [::]:80;
    server_name doctorbnajot.uz www.doctorbnajot.uz;

    # Certbot tekshiruvi uchun
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doctorbnajot.uz www.doctorbnajot.uz;

    # --- Sertifikat (certbot o'zi to'ldiradi) ---
    # ssl_certificate     /etc/letsencrypt/live/doctorbnajot.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/doctorbnajot.uz/privkey.pem;

    # --- Hajm chegarasi ---
    # Imzo rasmi + hujjatlar uchun yetarli
    client_max_body_size 20M;

    # --- Xavfsizlik sarlavhalari ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # --- Loglar ---
    access_log /var/log/nginx/edumed-access.log;
    error_log  /var/log/nginx/edumed-error.log warn;

    # --- Statik fayllar (nginx to'g'ridan-to'g'ri beradi — tez) ---
    location /static/ {
        alias /opt/edumed-his/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Yuklangan fayllar (imzolar, rasmlar) ---
    location /media/ {
        alias /opt/edumed-his/media/;
        expires 7d;
        access_log off;
    }

    # --- Django ---
    location / {
        proxy_pass http://edumed_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # MUHIM: Django shu sarlavha orqali HTTPS ekanini biladi.
        # Bo'lmasa cheksiz qayta yo'naltirish (redirect loop) bo'ladi.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_buffering off;

        # Uzoq so'rovlar (hisobot, Word eksport) uzilib qolmasligi uchun
        proxy_connect_timeout 60s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # Navbat tablosi jonli yangilanadi — keshlanmasin
    location /registration/board/ {
        proxy_pass http://edumed_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
}
